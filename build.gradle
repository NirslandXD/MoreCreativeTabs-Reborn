plugins {
    id 'base'
}

// Jenkins
ext {
    release = project.properties['release'] ?: false
}

def version_base = "${project.base_version}"
def final_ver = "${version_base}.${project.version_patch}"
def loaderNames = ["Fabric", "Forge"]

if (System.getenv('BUILD_NUMBER') != null && project.release == false) {
    final_ver = version_base + "." + System.getenv('BUILD_NUMBER') + "d"
}

subprojects {
    apply plugin: 'java'
    java.toolchain.languageVersion = JavaLanguageVersion.of(17)
    version = final_ver

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name.replace(":", "").replace(" ", "")}" }
        }
        manifest {
            attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 17
    }

    tasks.withType(GenerateModuleMetadata) {
        enabled = false
    }

    if (project.name in loaderNames) {
        def devOutputDir = layout.buildDirectory.dir("devlibs")
        def remappedOutputDir = layout.buildDirectory.dir("libs")
        if (project.name == "Forge") {
            tasks.named("jar", Jar) {
                destinationDirectory = remappedOutputDir
            }
            def devJar = tasks.register("devJar", Copy) {
                dependsOn(tasks.named("jar"))
                from({ tasks.named("jar").get().archiveFile.get().asFile })
                into(devOutputDir)
                rename { fileName -> fileName.replaceFirst(/\.jar$/, "-dev.jar") }
            }
            tasks.matching { it.name == "reobfJar" }.configureEach {
                mustRunAfter(devJar)
            }
            tasks.named("build") {
                dependsOn(devJar)
            }
        } else {
            tasks.named("jar", Jar) {
                destinationDirectory = devOutputDir
            }
            tasks.matching { it.name == "remapJar" }.configureEach {
                destinationDirectory = remappedOutputDir
            }
        }
    }
}

def loaderProjects = subprojects.findAll { it.name in loaderNames }

loaderProjects.each { lp ->
    def loaderProject = lp
    def taskName = "collect${loaderProject.name}Output"
    tasks.register(taskName, Copy) {
        dependsOn(":${loaderProject.name}:build")
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        def outputDir = layout.buildDirectory.dir("libs/${loaderProject.name}")
        into(outputDir)
        doFirst {
            delete(outputDir)
        }
        if (loaderProject.name == "Forge") {
            dependsOn(loaderProject.tasks.named("devJar"))
            from({ loaderProject.tasks.named("jar").get().archiveFile.get().asFile })
        } else {
            dependsOn(loaderProject.tasks.matching { it.name == "remapJar" })
            from({ loaderProject.tasks.named("remapJar").get().archiveFile.get().asFile })
        }
        def devLibs = loaderProject.file("build/devlibs")
        from(devLibs) {
            include "*-dev.jar"
        }
    }
}

if (findProject(":Fabric") != null) project(":Forge") {
    // Build Fabric first so ForgeGradle does not race Fabric Loom for caches.
    tasks.configureEach {
        mustRunAfter(":Fabric:build")
    }
}

tasks.register("collectModloaderOutputs") {
    dependsOn(loaderProjects.collect { "collect${it.name}Output" })
}

tasks.named("assemble") {
    dependsOn("collectModloaderOutputs")
}

tasks.named("build") {
    dependsOn("collectModloaderOutputs")
}


