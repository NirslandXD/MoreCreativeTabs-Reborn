archivesBaseName = "${mod_name.replace(" ", "").replace(":", "")}-Common-${minecraft_version}"

jar.enabled = false
assemble.enabled = false

dependencies {

}

unimined.minecraft {
    fabric {
        loader fabric_loader
    }

    defaultRemapJar = false
}

processResources {
    def buildProps = project.properties.clone()

    filesMatching(['pack.mcmeta']) {
        expand buildProps
    }
}