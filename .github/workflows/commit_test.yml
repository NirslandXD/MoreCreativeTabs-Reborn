name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and collect Fabric
        run: ./gradlew clean :Fabric:build :collectFabricOutput --stacktrace --max-workers=1
      - name: Build and collect Forge
        run: ./gradlew :Forge:build :collectForgeOutput -Ponly_forge=true --stacktrace --max-workers=1
