pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url "https://mcentral.firstdark.dev/releases"
        }
        maven {
            url "https://maven.firstdark.dev/releases"
        }
        maven {
            url "https://maven.firstdark.dev/snapshots"
        }
    }
}

rootProject.name = 'MoreCreativeTabsReborn'
include("Common", "Forge")

// A Forge-only build avoids resolving Fabric's Minecraft development runtime.
// The combined 1.19.3-1.19.4 target uses the same Forge artifact label as Fabric.
if (!gradle.startParameter.projectProperties.getOrDefault("only_forge", "false").toBoolean()) {
    include("Fabric")
}
